---
- hosts: all
  become: true
  vars:
    default_username: vagrant
    default_docker_group: docker
    

  tasks:
    - name: Install Terraform by official docs
      ansible.builtin.shell: |
        set -eo pipefail
        wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/hashicorp.list
        apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y terraform
      args:
        executable: /bin/bash
        chdir: /home/vagrant/
        creates: /usr/bin/terraform
      register: terraform_install
      until: terraform_install is not failed
      retries: 5
      delay: 10
