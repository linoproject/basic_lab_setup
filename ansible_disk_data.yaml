---
- hosts: all
  become: true
  vars:
    data_vg: data-vg
    data_lv: data
    data_path: /opt/data
    # Leave empty to auto-detect the extension disk (the only disk with no partitions/holders)
    data_disk: ""

  tasks:
    - name: Find the unused extension disk
      set_fact:
        data_disk_candidates: >-
          {{ ansible_devices | dict2items
             | selectattr('key', 'match', '^(sd|vd|xvd|nvme)')
             | selectattr('value.partitions', 'equalto', {})
             | selectattr('value.holders', 'equalto', [])
             | map(attribute='key') | list }}
      when: data_vg not in (ansible_lvm.vgs | default({}))

    - name: Check that exactly one extension disk was found
      fail:
        msg: "Expected one unused disk, found {{ data_disk_candidates }}. Set data_disk explicitly."
      when:
        - data_vg not in (ansible_lvm.vgs | default({}))
        - data_disk == ""
        - data_disk_candidates | length != 1

    - name: Create the "{{ data_vg }}" Volume Group on the extension disk
      lvg:
        vg: "{{ data_vg }}"
        pvs: "/dev/{{ data_disk if data_disk != '' else data_disk_candidates[0] }}"
        state: present
      when: data_vg not in (ansible_lvm.vgs | default({}))

    - name: Create the "{{ data_lv }}" Logical Volume
      lvol:
        vg: "{{ data_vg }}"
        lv: "{{ data_lv }}"
        size: 100%FREE
        shrink: no
        state: present

    - name: Create an ext4 filesystem on the data volume
      filesystem:
        fstype: ext4
        dev: "/dev/{{ data_vg }}/{{ data_lv }}"
        force: no

    - name: Create the mount point
      file:
        path: "{{ data_path }}"
        state: directory
        mode: '0755'

    - name: Mount the data volume
      mount:
        path: "{{ data_path }}"
        src: "/dev/{{ data_vg }}/{{ data_lv }}"
        fstype: ext4
        opts: rw,nosuid,noexec
        state: mounted
